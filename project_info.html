<!doctype html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Project Info</title>

  <style>
    body {
      opacity: 0;
      transition: opacity 0.45s ease-in;
      /* duration + easing */
    }

    /* After page loads */
    body.loaded {
      opacity: 1;
    }
  </style>

</head>

<body class="min-h-screen flex flex-col justify-start items-center antialiased transition-colors duration-300">

  <!-- Navbar -->

  <nav class="z-50 flex w-full justify-between items-start lg:justify-center lg:items-center fixed bg-white/90">
    <!-- Contact option -->
    <div id="contact-container" class="hidden lg:flex gap-3  justify-between items-center fixed left-6 top-6 hover:scale-105 hover:tracking-wide transition-all duration-500 ease-initial">
      <button id="contact-button" class="text-lg active:scale-95 active:text-gray-300 transition-all duration-300" href="">Reach me</button>
      <a href="https://www.linkedin.com/in/antormorsalin/" class="hidden text-sm  hover:scale-115 hover:tracking-wide active:scale-95 active:text-gray-300 transition-all duration-300 contact-list" target="_blank">
        <img src="./assets/icons/linkedin.png" class="w-[22px]" alt="">
      </a>
      <a href="https://github.com/antor-morsalin" class="hidden text-sm hover:scale-115 hover:tracking-wide active:scale-95 active:text-gray-300 transition-all duration-300 contact-list" target="_blank">
        <img src="./assets/icons/github.png" class="w-[25px]" alt="">
      </a>
      <a href="https://www.youtube.com/@antor_morsalin04" class="hidden text-sm hover:scale-115 hover:tracking-wide active:scale-95 active:text-gray-300 transition-all duration-300 contact-list" target="_blank">
        <img src="./assets/icons/youtube.png" class="w-[25px]" alt="">
      </a>
    </div>

    <!-- this will hold all the options -->
    <div id="menu-container" class="hidden lg:flex justify-evenly items-center w-full max-w-[140px] bg-black/90 rounded-full h-[40px] m-5 transition-all duration-500 ease-in-out overflow-hidden shadow-lg">

      <!-- <a class="hidden text-white text-sm px-3 hover:scale-105 hover:tracking-wide active:scale-95 active:text-gray-300 transition-all duration-300 menu-items" href="">Home</a>
      <a class="hidden text-white px-3 hover:scale-105 hover:tracking-wide active:scale-95 active:text-gray-300 transition-all duration-300 menu-items" href="">Skills</a>
      <a class="hidden text-white px-3 hover:scale-105 hover:tracking-wide active:scale-95 active:text-gray-300 transition-all duration-300 menu-items" href="">Projects</a>
      <a class="hidden text-white px-3 hover:scale-105 hover:tracking-wide active:scale-95 active:text-gray-300 transition-all duration-300 menu-items" href="">Academics</a> -->

      <!-- Menu bar -->
      <button id="menu-bar" class="text-white w-full px-3 hover:scale-105 hover:tracking-wide active:scale-95 active:text-gray-300 transition-all duration-300" href="">Menu</button>

    </div>

    <!-- Nav design for mobile -->
    <div id="contact-container-mobile" class="flex flex-col gap-4 lg:hidden justify-center items-center w-full max-w-[140px] my-5 py-2 px-3 mx-3
    transition-all duration-500 ease-in-out hover:scale-105">
      <button id="contact-button-mobile" class="text-lg transition-all duration-300 ease-in-out hover:scale-105 hover:tracking-wider">Reach me</button>
      <a href="https://www.linkedin.com/in/antormorsalin/" target="_blank" class="hidden text-sm active:text-gray-300 contact-list-mobile transition-all duration-300 ease-in-out hover:scale-105 hover:tracking-wider">Linkedin</a>
      <a href="https://github.com/antor-morsalin" class="hidden text-sm active:text-gray-300 contact-list-mobile transition-all duration-300 ease-in-out hover:scale-105 hover:tracking-wider" target="_blank">Github</a>
      <a href="https://www.youtube.com/@antor_morsalin04" class="hidden text-sm active:text-gray-300 contact-list-mobile transition-all duration-300 ease-in-out hover:scale-105 hover:tracking-wider" target="_blank">YouTube</a>
    </div>

    <!-- this will hold all the options -->
    <div id="menu-container-mobile" class="flex bg-black/90 flex-col gap-4 lg:hidden justify-evenly items-center w-full max-w-[140px] my-5 shadow-md py-2 px-3 rounded-3xl mx-8
    transition-all duration-300 ease-in-out hover:scale-105 hover:shadow-lg">
      <!-- Menu bar -->
      <button id="menu-bar-mobile" class="px-3 text-white text-lg transition-all duration-300 ease-in-out hover:scale-105 hover:tracking-wider">Menu</button>
      <a class="hidden text-white px-3 text-sm active:scale-95 active:text-gray-300 menu-items-mobile transition-all duration-300 ease-in-out hover:scale-105 hover:tracking-wider" href="index.html">Home</a>
      <a class="hidden text-white px-3 text-sm active:scale-95 active:text-gray-300 menu-items-mobile transition-all duration-300 ease-in-out hover:scale-105 hover:tracking-wider" href="skill_set.html">Skills</a>
      <a class="hidden text-white px-3 text-sm active:scale-95 active:text-gray-300 menu-items-mobile transition-all duration-300 ease-in-out hover:scale-105 hover:tracking-wider" href="projects.html">Projects</a>
      <a class="hidden text-white px-3 text-sm active:scale-95 active:text-gray-300 menu-items-mobile transition-all duration-300 ease-in-out hover:scale-105 hover:tracking-wider" href="academics.html">Academics</a>
    </div>

  </nav>


  <!-- main body -->
  <main class="flex-1 max-w-[1920px] w-full px-4 md:px-8 mx-auto mt-28 mb-16">

    <!-- Header -->
    <div class="mb-7 border-b border-black/10 pb-6">
      <h1 id="project-name"
        class="font-serif font-bold text-black tracking-tight text-3xl md:text-4xl lg:text-[44px] leading-tight">
      </h1>

      <div class="mt-5 flex flex-wrap items-center gap-x-7 gap-y-3">

        <a id="youtube-link" href="" target="_blank"
          class="group inline-flex items-center gap-2.5 text-sm md:text-[15px] text-neutral-700 hover:text-black transition-colors duration-200">
          <span class="relative">
            Project Video on YouTube
            <span class="absolute left-0 -bottom-1 h-px w-0 bg-black transition-all duration-300 group-hover:w-full"></span>
          </span>
          <img src="./assets/icons/youtube.png"
            class="w-5 md:w-[22px] opacity-70 grayscale transition-all duration-300 group-hover:opacity-100 group-hover:translate-x-0.5"
            alt="">
        </a>

        <a id="github-link" href="" target="_blank"
          class="group inline-flex items-center gap-2.5 text-sm md:text-[15px] text-neutral-700 hover:text-black transition-colors duration-200">
          <span class="relative">
            Code on GitHub
            <span class="absolute left-0 -bottom-1 h-px w-0 bg-black transition-all duration-300 group-hover:w-full"></span>
          </span>
          <img src="./assets/icons/github.png"
            class="w-5 md:w-[22px] opacity-70 grayscale transition-all duration-300 group-hover:opacity-100 group-hover:translate-x-0.5"
            alt="">
        </a>

      </div>
    </div>

    <!-- Content -->
    <div class="flex flex-col lg:flex-row items-stretch gap-6 xl:gap-8">

      <!-- Information -->
      <section
        class="group relative flex-1 min-w-0 lg:basis-[46%] border border-black/10 bg-white px-6 py-6 md:px-7 md:py-7 overflow-hidden
               transition-all duration-300 hover:border-black/20">

        <!-- subtle decorative line -->
        <div class="absolute left-0 top-0 h-full w-[2px] bg-black scale-y-0 origin-top transition-transform duration-500 group-hover:scale-y-100"></div>

        <div class="relative">
          <p id="info-intro"
            class="text-neutral-700 leading-7 md:leading-8 text-[15px] md:text-base mb-5">
          </p>

          <p id="info-insight"
            class="text-neutral-700 leading-7 md:leading-8 text-[15px] md:text-base mb-6">
          </p>

          <div class="border-t border-black/10 pt-5">
            <p id="info-tech-stack"
              class="text-neutral-950 leading-7 text-[15px] md:text-base font-semibold">
            </p>
          </div>
        </div>
      </section>

      <!-- Video -->
      <section
        class="group relative flex-1 min-w-0 lg:basis-[54%] border border-black/10 bg-neutral-50 p-2 md:p-3
               transition-all duration-300 hover:border-black/25">

        <div class="relative w-full h-full min-h-[280px] md:min-h-[320px] lg:min-h-[360px] overflow-hidden bg-black">
          <iframe id="project-video"
            class="absolute inset-0 w-full h-full transition-transform duration-500 ease-out group-hover:scale-[1.005]"
            src=""
            title="YouTube video player"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
          </iframe>
        </div>

      </section>

    </div>

  </main>


  <script>
    window.addEventListener("load", () => {
      document.body.classList.add("loaded");
    });
  </script>
  <script src="./src/js/navbar.js"></script>
  <script src="./src/js/contact.js"></script>
  <script src="./src/js/project_data_loader.js"></script>

</body>

</html>
