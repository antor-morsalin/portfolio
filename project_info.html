<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Project Info</title>

  <style>
    body {
      opacity: 0;
      transition: opacity 0.45s ease-in;
      /* duration + easing */
    }

    /* After page loads */
    body.loaded {
      opacity: 1;
    }
  </style>

</head>

<body class="min-h-screen flex flex-col justify-start items-center antialiased transition-colors duration-300">

  <!-- Navbar -->

  <nav aria-label="Main navigation"
    class="fixed z-50 grid w-full grid-cols-[auto_minmax(0,1fr)_auto] items-start gap-x-1 bg-white/90 px-1.5 min-[360px]:gap-x-2 min-[360px]:px-3 sm:grid-cols-3 sm:px-6 lg:flex lg:items-center lg:justify-center lg:px-0">

    <!-- Desktop navigation -->
    <div id="contact-container"
      class="fixed left-6 top-6 hidden items-center gap-3 transition-all duration-500 hover:scale-105 hover:tracking-wide lg:flex">
      <button id="contact-button" type="button" aria-expanded="false" aria-controls="contact-links"
        class="text-lg transition-all duration-300 active:scale-95">Reach me</button>
      <div id="contact-links" class="hidden items-center gap-3">
        <a href="https://www.linkedin.com/in/antormorsalin/" target="_blank" rel="noopener noreferrer">
          <img src="./assets/icons/linkedin.png" class="w-[22px]" alt="LinkedIn">
        </a>
        <a href="https://github.com/antor-morsalin" target="_blank" rel="noopener noreferrer">
          <img src="./assets/icons/github.png" class="w-[25px]" alt="GitHub">
        </a>
        <a href="https://www.youtube.com/@antor_morsalin04" target="_blank" rel="noopener noreferrer">
          <img src="./assets/icons/youtube.png" class="w-[25px]" alt="YouTube">
        </a>
      </div>
    </div>

    <div id="menu-container"
      class="m-5 hidden h-[40px] w-full max-w-[140px] items-center justify-evenly overflow-hidden rounded-full bg-black/90 shadow-lg transition-all duration-500 ease-in-out lg:flex">
      <button id="menu-bar" type="button" aria-controls="desktop-pages" aria-expanded="false"
        class="w-full px-3 text-white transition-all duration-300 hover:scale-105 hover:tracking-wide active:scale-95">Menu</button>
      <div id="desktop-pages" class="hidden w-full items-center justify-evenly">
        <a class="px-3 text-sm text-white transition-all duration-300 hover:scale-105 hover:tracking-wide" href="index.html">Home</a>
        <a class="px-3 text-sm text-white transition-all duration-300 hover:scale-105 hover:tracking-wide" href="skill_set.html">Skills</a>
        <a class="px-3 text-sm text-white transition-all duration-300 hover:scale-105 hover:tracking-wide" href="projects.html">Projects</a>
        <a class="px-3 text-sm text-white transition-all duration-300 hover:scale-105 hover:tracking-wide" href="highlights.html">Highlights</a>
      </div>
    </div>

    <!-- Mobile navigation -->
    <details name="mobile-navigation" class="my-5 justify-self-start text-center sm:w-full sm:max-w-[140px] lg:hidden">
      <summary class="flex min-h-11 cursor-pointer list-none items-center justify-center whitespace-nowrap text-sm transition-all duration-300 hover:tracking-wide min-[360px]:text-base sm:text-lg [&::-webkit-details-marker]:hidden">Reach me</summary>
      <div class="mt-3 flex flex-col items-center gap-4 pb-2 text-sm">
        <a href="https://www.linkedin.com/in/antormorsalin/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        <a href="https://github.com/antor-morsalin" target="_blank" rel="noopener noreferrer">GitHub</a>
        <a href="https://www.youtube.com/@antor_morsalin04" target="_blank" rel="noopener noreferrer">YouTube</a>
      </div>
    </details>

    <details name="mobile-navigation"
      class="my-5 w-full max-w-[140px] justify-self-center rounded-3xl bg-black/90 text-white shadow-md transition-all duration-300 hover:shadow-lg lg:hidden">
      <summary class="flex min-h-11 cursor-pointer list-none items-center justify-center px-1 text-lg transition-all duration-300 hover:tracking-wide [&::-webkit-details-marker]:hidden">Menu</summary>
      <div class="flex flex-col items-center gap-4 px-1 pb-3 pt-2 text-sm">
        <a href="index.html">Home</a>
        <a href="skill_set.html">Skills</a>
        <a href="projects.html">Projects</a>
        <a href="highlights.html">Highlights</a>
      </div>
    </details>

    <a href="./assets/documents/Mahmudul_Morsalin_Antor_Resume.pdf" download aria-label="Download Resume (PDF)"
      class="my-5 flex min-h-11 items-center justify-self-end text-sm underline-offset-4 hover:underline min-[360px]:text-base sm:text-lg lg:fixed lg:right-6 lg:top-6 lg:my-0 lg:min-h-0">Resume</a>
  </nav>


  <!-- main body -->
  <main class="flex-1 max-w-[1920px] w-full px-4 md:px-8 mx-auto mt-28 mb-16">

    <!-- Header -->
    <div class="mb-7 border-b border-black/10 pb-6">
      <h1 id="project-name"
        class="font-serif font-bold text-black tracking-tight text-3xl md:text-4xl lg:text-[44px] leading-tight">
      </h1>

      <div class="mt-5 flex flex-wrap items-center gap-x-7 gap-y-3">

        <a id="youtube-link" href="" target="_blank"
          class="group inline-flex items-center gap-2.5 text-sm md:text-[15px] text-neutral-700 hover:text-black transition-colors duration-200">
          <span class="relative">
            Project Video on YouTube
            <span class="absolute left-0 -bottom-1 h-px w-0 bg-black transition-all duration-300 group-hover:w-full"></span>
          </span>
          <img src="./assets/icons/youtube.png"
            class="w-5 md:w-[22px] opacity-70 grayscale transition-all duration-300 group-hover:opacity-100 group-hover:translate-x-0.5"
            alt="">
        </a>

        <a id="github-link" href="" target="_blank"
          class="group inline-flex items-center gap-2.5 text-sm md:text-[15px] text-neutral-700 hover:text-black transition-colors duration-200">
          <span class="relative">
            Code on GitHub
            <span class="absolute left-0 -bottom-1 h-px w-0 bg-black transition-all duration-300 group-hover:w-full"></span>
          </span>
          <img src="./assets/icons/github.png"
            class="w-5 md:w-[22px] opacity-70 grayscale transition-all duration-300 group-hover:opacity-100 group-hover:translate-x-0.5"
            alt="">
        </a>

      </div>
    </div>

    <!-- Content -->
    <div class="flex flex-col lg:flex-row items-stretch gap-6 xl:gap-8">

      <!-- Information -->
      <section
        class="group relative flex-1 min-w-0 lg:basis-[46%] border border-black/10 bg-white px-6 py-6 md:px-7 md:py-7 overflow-hidden
               transition-all duration-300 hover:border-black/20">

        <!-- subtle decorative line -->
        <div class="absolute left-0 top-0 h-full w-[2px] bg-black scale-y-0 origin-top transition-transform duration-500 group-hover:scale-y-100"></div>

        <div class="relative">
          <p id="info-intro"
            class="text-neutral-700 leading-7 md:leading-8 text-[15px] md:text-base mb-5">
          </p>

          <p id="info-insight"
            class="text-neutral-700 leading-7 md:leading-8 text-[15px] md:text-base mb-6">
          </p>

          <div class="border-t border-black/10 pt-5">
            <p id="info-tech-stack"
              class="text-neutral-950 leading-7 text-[15px] md:text-base font-semibold">
            </p>
          </div>
        </div>
      </section>

      <!-- Video -->
      <section
        class="group relative flex-1 min-w-0 lg:basis-[54%] border border-black/10 bg-neutral-50 p-2 md:p-3
               transition-all duration-300 hover:border-black/25">

        <div class="relative w-full h-full min-h-[280px] md:min-h-[320px] lg:min-h-[360px] overflow-hidden bg-black">
          <iframe id="project-video"
            class="absolute inset-0 w-full h-full transition-transform duration-500 ease-out group-hover:scale-[1.005]"
            src=""
            title="YouTube video player"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
          </iframe>
        </div>

      </section>

    </div>

  </main>


  <script>
    window.addEventListener("load", () => {
      document.body.classList.add("loaded");
    });
  </script>
  <script src="./src/js/navbar.js"></script>
  <script src="./src/js/contact.js"></script>
  <script src="./src/js/project_data_loader.js"></script>
